# cloud modules last - $all skips modules explicitly listed elsewhere
format = """
$all\
$kubernetes\
$aws\
$gcloud\
$openstack\
$azure\
$line_break\
$character"""

add_newline = true
command_timeout = 100

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[V](bold green)"

[line_break]
disabled = false

[kubernetes]
disabled = false
# env var only: starship ignores detect_env_vars when detect_files/folders are also set
# detect_files = ["Chart.yaml"]
# detect_folders = ["charts", "k8s"]
detect_env_vars = ["KUBECONFIG"]
[kubernetes.context_aliases]
'arn:aws:eks:[\w\d\-]+:[\d]+:cluster/(?P<var_cluster>[\w\d\-_]+)' = 'eks/$var_cluster'
