promptToReturnFromSubprocess: false
os:
  # opens files in parent nvim when lazygit runs inside nvim, otherwise new nvim in place
  editPreset: nvim-remote
gui:
  # grow the focused side panel so the selected pane gets most of the height
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 5
git:
  diffRenderers:
    - colorArg: always
      command: if command -v delta >/dev/null; then delta --paging=never --max-line-distance=0.3; else cat; fi
