unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-window-option -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# automatically renumber windows when somee are closed
set -g renumber-windows on
# changing window order
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
set -g history-limit 100000

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf
bind P paste-buffer

# Undercurl
# set -g default-terminal "${TERM}"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# pass modified keys like shift+enter through to apps (e.g. claude code) - needs tmux-3.2
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mouse on
set-option -g status-position top
set-option -g focus-events on # allows to toggle line numbers in vim

set -g set-clipboard on
set-window-option -g allow-passthrough on
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# if-shell 'test ! -z `which powerline-daemon`' 'run-shell "powerline-daemon -q --replace"'
# if-shell 'test ! -z `which powerline-config`' 'run-shell "powerline-config tmux setup"'

# allow nested tmux sessions
bind -T root F12  \
     if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
     set prefix None \;\
     set key-table off \;\
     set status off \;\
     refresh-client -S \;\

 bind -T off F12 \
     set -u prefix \;\
     set -u key-table \;\
     set status on \;\
     refresh-client -S \;\

set -g @fingers-key f
set -g @fingers-jump-key C-f
set -g @fingers-pattern-0 'test_.+::[^\s]+'
set -g @fingers-pattern-1 'sha256:[0-9a-fA-F]{64}'
set -g @fingers-pattern-2 '[0-9a-fA-F]{64}'
set -g @fingers-ctrl-action "xargs -I {} tmux run-shell 'cd #{pane_current_path}; ~/.tmux/plugins/tmux-open-nvim/scripts/ton {} > ~/.tmux/plugins/tmux-open-nvim/ton.log'"

# nvim
set -g @ton-prioritize-window true
set -g @ton-open-strategy ":tabnew"

# cliboard doesnt seem to work
# also doesnt support alt-action to directly paste
set -g @thumbs-key f
set -g @thumbs-osc52 1
set -g @thumbs-regexp-0 'test_.+::[^\s]+'
set -g @thumbs-regexp-1 'sha256:[0-9a-fA-F]{64}'
set -g @thumbs-regexp-2 '[0-9a-fA-F]{64}'

set -g @powerkit_status_interval "2"
set -g @powerkit_elements_spacing "false"
set -g @powerkit_edge_separator_style "normal"
set -g @powerkit_theme "ristretto"
set -g @powerkit_theme_variant "default"
set -g @powerkit_plugins "group(cpu,memory,swap),group(datetime,hostname)"
set -g @powerkit_plugin_memory_format "percentage"
set -g @powerkit_plugin_datetime_format "%Y-%m-%d %H:%M"
# C-d is for the diff review popup
set -g @powerkit_cache_clear_key "M-d"
# red bell icon (e.g. claude waiting for input); reset fg to inactive window text color after it
set -g @powerkit_window_bell_icon "#[fg=#ff8297]󰂚#[fg=#e3e2e2]"
# show claude state in tabs. keep the bell while waiting as the bell flag clears on visiting a window
CLAUDE_STATE="\
#{?#{&&:#{==:#{@claude},waiting},#{!=:#{window_bell_flag},1}},#[fg=#ff8297]󰂚#[fg=default] ,\
#{?#{==:#{@claude},background},#[fg=#f9cc6c]󰔟#[fg=default] ,\
#{?#{==:#{@claude},running},#[fg=#adda78]󰐊#[fg=default] ,}}}"
set -g @powerkit_inactive_window_title "$CLAUDE_STATE#W"
set -g @powerkit_active_window_title "$CLAUDE_STATE#W"

TMUX_FZF_LAUNCH_KEY="M-f"
# custom name if renamed by hand (automatic-rename is then off), then always directory and pane title
PICKER_WINDOW_NAME="#{?automatic-rename,,#{window_name} }#{b:pane_current_path}: #{pane_title}"
# same colors as the tab icons, as ANSI (fzf runs with --ansi)
PICKER_WAITING="\e[38;2;255;130;151m󰂚 WAITING\e[39m "
PICKER_BELL="\e[38;2;255;130;151m󰂚 BELL\e[39m "
PICKER_BACKGROUND="\e[38;2;249;204;108m󰔟 BACKGROUND\e[39m "
PICKER_RUNNING="\e[38;2;173;218;120m󰐊 RUNNING\e[39m "
# state label. left open so each picker adds what to show for no state and then closes it with PICKER_STATE_END
PICKER_STATE_START="\
#{?#{==:#{@claude},waiting},$PICKER_WAITING,\
#{?window_bell_flag,$PICKER_BELL,\
#{?#{==:#{@claude},background},$PICKER_BACKGROUND,\
#{?#{==:#{@claude},running},$PICKER_RUNNING,"
PICKER_STATE_END="}}}}"
TMUX_FZF_WINDOW_FORMAT="$PICKER_STATE_START$PICKER_STATE_END$PICKER_WINDOW_NAME #{?window_active,(current),}"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m --ansi"
bind-key "C-s" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind-key "C-w" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"
# fzf picker for claude sessions across all tmux sessions, waiting first, with pane preview
# first two fields are for sorting and switching and are hidden by fzf
CLAUDE_PICKER_SORT="\
#{?#{==:#{@claude},waiting},0,\
#{?window_bell_flag,1,\
#{?#{==:#{@claude},background},2,\
#{?#{==:#{@claude},running},3,4}}}}"
CLAUDE_PICKER_FORMAT="\
$CLAUDE_PICKER_SORT #{session_id}:#{window_id} \
${PICKER_STATE_START}IDLE $PICKER_STATE_END\
#{session_name}:#{window_index} $PICKER_WINDOW_NAME"
bind-key "C-c" display-popup -E -w 80% -h 60% "\
tmux list-windows -a -f '#{@claude}' -F '$CLAUDE_PICKER_FORMAT' \
| sort \
| fzf --ansi --no-sort --with-nth=3.. \
--preview 'tmux capture-pane -ep -t {2}' --preview-window=right,50% \
| cut -d' ' -f2 \
| xargs -I{} tmux switch-client -t {}"
# review changes in the current pane's repo (e.g. claude's worktree) with lazygit or as nvim diffs
bind-key "C-g" display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind-key "C-d" display-popup -E -w 95% -h 95% -d "#{pane_current_path}" "nvim -c 'Git difftool -y'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'brennanfee/tmux-paste'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Morantron/tmux-fingers'
# set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'fabioluciano/tmux-powerkit'
# set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'trevarj/tmux-open-nvim'
# continuum autosaves via status-right so it has to load after the theme
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# nvim is restored with its original args. plain nvim restores its cwd session via auto-session
# resume claude conversations. claude is not in @resurrect-processes so it only starts once
set -g @resurrect-hook-post-save-layout 'sh ~/.claude/skills/tmux-state/resurrect.sh layout'
set -g @resurrect-hook-post-save-all 'sh ~/.claude/skills/tmux-state/resurrect.sh save'
set -g @resurrect-hook-post-restore-all 'sh ~/.claude/skills/tmux-state/resurrect.sh restore'

run '~/.tmux/plugins/tpm/tpm'

# resources
# https://dev.to/iggredible/useful-tmux-configuration-examples-k3g
# https://github.com/samoshkin/tmux-config
